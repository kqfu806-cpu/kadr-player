<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Курымдык</title>
  <link rel="icon" href="icons/favicon.ico" />
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #0a0a0c; font-family: "Segoe UI", system-ui, sans-serif; color: #f3f2ef; }
    .bg {
      position: fixed; inset: -10%;
      background:
        radial-gradient(40% 50% at 20% 20%, rgba(220,216,208,.28), transparent 60%),
        radial-gradient(45% 40% at 82% 10%, rgba(80,70,55,.35), transparent 55%),
        #0a0a0c;
      filter: blur(60px);
      animation: drift 18s ease-in-out infinite;
    }
    @keyframes drift {
      0%,100% { transform: scale(1.05) translate(0,0); }
      50% { transform: scale(1.18) translate(-3%, 2%); }
    }
    .wrap {
      position: relative; z-index: 1;
      height: 100%; display: grid; place-items: center;
      animation: fade 0.7s ease;
    }
    @keyframes fade { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    .logo {
      width: 96px; height: 96px; border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.22), transparent 50%), #141418;
      box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 18px 50px rgba(0,0,0,.45);
      margin: 0 auto 1.2rem;
    }
    .logo svg { width: 42px; height: 42px; fill: #f3f2ef; }
    h1 { margin: 0; letter-spacing: .28em; font-size: 0.95rem; font-weight: 700; text-align: center; }
    p { margin: .85rem 0 1.2rem; color: rgba(243,242,239,.55); font-size: .85rem; text-align: center; min-height: 1.2em; }
    .bar {
      width: min(16rem, 56vw); height: 3px; border-radius: 99px;
      background: rgba(255,255,255,.12); overflow: hidden; margin: 0 auto;
    }
    .bar > i {
      display: block; height: 100%; width: 30%;
      background: linear-gradient(90deg, #fff, #c8c4bc);
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(420%); } }
    .err { display: none; text-align: center; }
    .err.on { display: block; }
    button {
      margin-top: 1rem; border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08); color: inherit;
      border-radius: 999px; padding: .5rem 1.1rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l12-7z"/></svg>
      </div>
      <h1>Курымдык</h1>
      <p id="msg">Запускаю сервер…</p>
      <p id="ollamaStatus" style="margin:.2rem 0 .6rem;font-size:.75rem;color:rgba(243,242,239,.45);">Ollama: …</p>
      <div class="bar" id="bar"><i></i></div>
      <div class="err" id="err">
        <p>Сервер не ответил за 30 секунд.</p>
        <button type="button" id="retry">Повторить</button>
      </div>
    </div>
  </div>
  <script>
    var stages = ["Запускаю Ollama…", "Запускаю сервер…", "Загружаю библиотеку…", "Готово"];
    var i = 0;
    var t = setInterval(function () {
      i = Math.min(i + 1, stages.length - 1);
      document.getElementById("msg").textContent = stages[i];
    }, 1400);
    if (/[?&]warn=ollama/.test(location.search)) {
      document.getElementById("msg").textContent =
        "Ollama не запущена — клипы будут выбираться эвристикой (низкая точность)";
    }
    if (/[?&]err=1/.test(location.search)) {
      clearInterval(t);
      document.getElementById("bar").style.display = "none";
      document.getElementById("msg").textContent = "";
      document.getElementById("err").classList.add("on");
    }
    document.getElementById("retry").onclick = function () {
      location.search = "";
      location.reload();
    };
    function setOllamaStatus(txt) {
      var el = document.getElementById("ollamaStatus");
      if (el) el.textContent = txt;
    }
    function probeOllama() {
      fetch("http://127.0.0.1:11434/api/tags").then(function (r) {
        if (r.ok) setOllamaStatus("Ollama: OK");
        else setOllamaStatus("Ollama: offline");
      }).catch(function () {
        fetch("http://127.0.0.1:8000/api/health").then(function (r) { return r.json(); }).then(function (h) {
          var on = h && h.ollama && h.ollama.online;
          setOllamaStatus(on ? "Ollama: OK" : "Ollama: offline");
        }).catch(function () { setOllamaStatus("Ollama: offline"); });
      });
    }
    probeOllama();
    setInterval(probeOllama, 4000);
    (function ping() {
      fetch("http://127.0.0.1:8000/api/health").then(function (r) {
        if (r.ok) {
          document.getElementById("msg").textContent = "Готово";
          r.json().then(function (h) {
            var on = h && h.ollama && h.ollama.online;
            setOllamaStatus(on ? "Ollama: OK" : "Ollama: offline");
          }).catch(function () {});
          setTimeout(function () { location.href = "http://127.0.0.1:8000/"; }, 250);
        } else setTimeout(ping, 400);
      }).catch(function () { setTimeout(ping, 400); });
    })();
  </script>
</body>
</html>
