<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Курымдык — оверлей</title>
<style>
  /* ---------- база: окно прозрачное, фон игры просвечивает ---------- */
  :root {
    --w: 320px;
    --h-collapsed: 58px;
    --h-expanded: 404px;
    --accent: #ff6b9d;
    --accent-2: #00d4ff;
    --text: #f4f4f6;
    --muted: rgba(244, 244, 246, 0.58);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  /* ---------- сам островок ---------- */
  #island {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: var(--w);
    height: var(--h-collapsed);
    border-radius: 29px;
    /* единственный backdrop-filter в документе */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background:
      linear-gradient(180deg, rgba(38, 38, 46, 0.62), rgba(16, 16, 20, 0.72));
    border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.16);
    overflow: hidden;
    transition:
      height 0.45s cubic-bezier(0.2, 0.9, 0.25, 1),
      border-radius 0.45s cubic-bezier(0.2, 0.9, 0.25, 1),
      box-shadow 0.45s ease;
    cursor: pointer;
  }
  #island:hover { border-color: rgba(255, 255, 255, 0.22); }
  #island.open {
    height: var(--h-expanded);
    border-radius: 26px;
    box-shadow:
      0 18px 46px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  /* верхний блик стекла */
  #island::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0) 46%);
  }

  /* ---------- свёрнутое состояние ---------- */
  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    height: var(--h-collapsed);
    padding: 0 16px;
    transition: opacity 0.28s ease, transform 0.35s cubic-bezier(0.2, 0.9, 0.25, 1);
  }
  .cover {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 12px;
    object-fit: cover;
    background: linear-gradient(135deg, rgba(255, 107, 157, 0.45), rgba(0, 212, 255, 0.35));
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
  }
  .meta { min-width: 0; flex: 1; }
  .title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .artist {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
    flex: 0 0 auto;
    opacity: 0.25;
    transition: opacity 0.3s ease;
  }
  .bars i {
    width: 3px;
    height: 5px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
  }
  .bars.on { opacity: 1; }
  .bars.on i { animation: bounce 0.9s ease-in-out infinite; }
  .bars.on i:nth-child(2) { animation-delay: 0.18s; }
  .bars.on i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce {
    0%, 100% { height: 5px; }
    50% { height: 15px; }
  }

  /* ---------- раскрытое состояние ---------- */
  .panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px 18px 16px;
    opacity: 0;
    transform: translateY(14px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.3s ease 0.05s, transform 0.42s cubic-bezier(0.2, 0.9, 0.25, 1) 0.05s;
  }
  #island.open .panel { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  #island.open .row { opacity: 0; transform: translateY(-10px) scale(0.97); pointer-events: none; }

  .big-cover {
    width: 188px;
    height: 188px;
    border-radius: 20px;
    object-fit: cover;
    background: linear-gradient(135deg, rgba(255, 107, 157, 0.4), rgba(0, 212, 255, 0.3));
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
  }
  .panel .title {
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    max-width: 100%;
  }
  .panel .artist {
    font-size: 12.5px;
    text-align: center;
    max-width: 100%;
  }
  .album {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    max-width: 100%;
  }
  .progress {
    position: relative;
    width: 100%;
    height: 4px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
    margin-top: 2px;
  }
  .progress > i {
    position: absolute;
    inset: 0;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 0.25s linear;
  }
  .times {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .hint {
    margin-top: auto;
    font-size: 10px;
    color: rgba(244, 244, 246, 0.38);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .state {
    font-size: 11px;
    color: var(--muted);
  }
  .state .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--muted);
    vertical-align: middle;
  }
  .state.playing .dot {
    background: var(--accent-2);
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.9);
  }
</style>
</head>
<body>
  <div id="island" role="button" tabindex="0" aria-label="Плеер — нажми, чтобы раскрыть">
    <!-- свёрнутое состояние -->
    <div class="row">
      <img class="cover" id="coverSmall" alt="" />
      <div class="meta">
        <div class="title" id="titleSmall">Курымдык</div>
        <div class="artist" id="artistSmall">нажми, чтобы раскрыть</div>
      </div>
      <div class="bars" id="bars"><i></i><i></i><i></i></div>
    </div>

    <!-- раскрытое состояние -->
    <div class="panel">
      <img class="big-cover" id="coverBig" alt="" />
      <div class="title" id="titleBig">Ничего не играет</div>
      <div class="artist" id="artistBig">—</div>
      <div class="album" id="albumBig"></div>
      <div class="progress"><i id="progressFill"></i></div>
      <div class="times">
        <span id="timeNow">0:00</span>
        <span id="timeAll">0:00</span>
      </div>
      <div class="state" id="state"><span class="dot"></span><span id="stateText">ожидание</span></div>
      <div class="hint">клик — свернуть</div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var island = document.getElementById("island");
  var els = {
    coverSmall: document.getElementById("coverSmall"),
    coverBig: document.getElementById("coverBig"),
    titleSmall: document.getElementById("titleSmall"),
    artistSmall: document.getElementById("artistSmall"),
    titleBig: document.getElementById("titleBig"),
    artistBig: document.getElementById("artistBig"),
    albumBig: document.getElementById("albumBig"),
    bars: document.getElementById("bars"),
    progressFill: document.getElementById("progressFill"),
    timeNow: document.getElementById("timeNow"),
    timeAll: document.getElementById("timeAll"),
    state: document.getElementById("state"),
    stateText: document.getElementById("stateText")
  };

  var state = {
    open: false,
    playing: false,
    track: null,
    position: 0,
    duration: 0,
    recvAt: 0
  };

  function fmt(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }

  function setText(el, value) {
    var text = value == null ? "" : String(value);
    if (el.textContent !== text) el.textContent = text;
  }

  function setCover(src) {
    var url = src || "";
    if (els.coverSmall.getAttribute("src") !== url) els.coverSmall.setAttribute("src", url);
    if (els.coverBig.getAttribute("src") !== url) els.coverBig.setAttribute("src", url);
  }

  function render() {
    var t = state.track;
    var title = t && t.title ? t.title : "Курымдык";
    var artist = t && t.artist ? t.artist : "нажми, чтобы раскрыть";
    var album = t && t.album ? t.album : "";

    setText(els.titleSmall, title);
    setText(els.artistSmall, artist);
    setText(els.titleBig, t && t.title ? t.title : "Ничего не играет");
    setText(els.artistBig, artist);
    setText(els.albumBig, album);
    setCover(t && t.cover ? t.cover : "");

    els.bars.classList.toggle("on", !!state.playing);
    els.state.classList.toggle("playing", !!state.playing);
    setText(els.stateText, state.playing ? "играет" : (t ? "пауза" : "ожидание"));
    setText(els.timeAll, fmt(state.duration));
    paintProgress();
  }

  function currentPosition() {
    if (!state.playing) return state.position;
    var dt = (performance.now() - state.recvAt) / 1000;
    var pos = state.position + dt;
    if (state.duration > 0 && pos > state.duration) pos = state.duration;
    return pos;
  }

  function paintProgress() {
    var pos = currentPosition();
    var ratio = state.duration > 0 ? pos / state.duration : 0;
    if (ratio < 0) ratio = 0;
    if (ratio > 1) ratio = 1;
    els.progressFill.style.transform = "scaleX(" + ratio + ")";
    setText(els.timeNow, fmt(pos));
  }

  // прогресс идёт локально: позицию двигаем сами, сервер не дёргаем
  var rafId = 0;
  function loop() {
    rafId = 0;
    if (!state.playing || document.hidden) return;
    paintProgress();
    rafId = requestAnimationFrame(loop);
  }
  function startLoop() {
    if (!rafId && state.playing && !document.hidden) rafId = requestAnimationFrame(loop);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    } else {
      paintProgress();
      startLoop();
    }
  });

  // ---------- раскрытие / сворачивание ----------
  function notifyNative(open) {
    try {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.set_expanded) {
        window.pywebview.api.set_expanded(!!open);
      }
    } catch (_) {}
  }

  function setOpen(open) {
    if (state.open === open) return;
    state.open = open;
    island.classList.toggle("open", open);
    island.setAttribute("aria-expanded", open ? "true" : "false");
    notifyNative(open);
  }

  island.addEventListener("click", function () { setOpen(!state.open); });
  island.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      setOpen(!state.open);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.open) setOpen(false);
  });

  // ---------- WebSocket: тот же /ws, что и у основного плеера ----------
  function wsUrl() {
    var proto = location.protocol === "https:" ? "wss" : "ws";
    return proto + "://" + location.host + "/ws";
  }

  var ws = null;
  var retry = 0;
  var pingTimer = null;

  function onNowPlaying(msg) {
    var t = msg && msg.track ? msg.track : null;
    state.track = t;
    state.playing = !!(msg && msg.playing && t);
    state.position = Number(msg && msg.position) || 0;
    state.duration = Number(t && t.duration) || 0;
    state.recvAt = performance.now();
    render();
    startLoop();
  }

  function connect() {
    try {
      ws = new WebSocket(wsUrl());
    } catch (_) {
      scheduleReconnect();
      return;
    }
    ws.onopen = function () {
      retry = 0;
      // один общий ping-таймер на всё окно (не создаётся на каждый реконнект)
      if (!pingTimer) {
        pingTimer = setInterval(function () {
          try {
            if (ws && ws.readyState === 1) ws.send("ping");
          } catch (_) {}
        }, 20000);
      }
    };
    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (_) { return; }
      if (!msg || msg.type !== "now_playing") return;
      onNowPlaying(msg);
    };
    ws.onclose = function () {
      ws = null;
      scheduleReconnect();
    };
    ws.onerror = function () {
      try { ws.close(); } catch (_) {}
    };
  }

  function scheduleReconnect() {
    retry = Math.min(retry + 1, 6);
    setTimeout(connect, Math.min(8000, 600 * retry));
  }

  connect();
  render();
})();
</script>
</body>
</html>
